<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Arena</title>
    <meta
      name="description"
      content="Local console for the model frontends served through one Caddy route on :8080."
    />
    <!-- Placeholder mark: a route slash. Replace it when there is a real one. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f8f4ed'/%3E%3Cpath d='M21 5 11 27' stroke='%23a32b3f' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..500&family=Geist:wght@400..600&family=Newsreader:opsz,wght@6..72,400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so the page never flashes the other mode.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("ai-arena-theme");
        } catch (err) {
          saved = null;
        }
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.dataset.theme = "dark";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
