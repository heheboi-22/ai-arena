<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket World</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="ui-panel">
        <header>
          <h1>Pocket World</h1>
          <p class="subtitle">Orbit to view &middot; Scroll to zoom</p>
        </header>

        <div class="control-group">
          <label for="time-slider" class="control-label">
            <span>Time of Day</span>
            <span id="time-display">16:00</span>
          </label>
          <input type="range" id="time-slider" min="0" max="23.99" step="0.1" value="16">
        </div>

        <div class="control-group">
          <span class="control-label">Weather</span>
          <div class="segmented-control">
            <button id="weather-clear" class="active">Clear</button>
            <button id="weather-rain">Rain</button>
          </div>
        </div>

        <div class="control-group">
          <label for="wind-slider" class="control-label">
            <span>Wind Strength</span>
            <span id="wind-display">30%</span>
          </label>
          <input type="range" id="wind-slider" min="0" max="100" step="1" value="30">
        </div>

        <div class="control-group border-top">
          <span class="control-label">House Lights</span>
          <div class="toggle-switch">
             <input type="checkbox" id="lights-toggle">
             <label for="lights-toggle"></label>
          </div>
        </div>
        
        <div class="actions">
          <button id="reset-button">Reset World</button>
        </div>
      </div>
      <div id="error-screen" class="hidden">
        <h2>WebGL Initialization Failed</h2>
        <p>Your browser may not support WebGL, or it might be disabled.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
